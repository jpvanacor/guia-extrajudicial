/* mesclagem, colar e importar */
function parseProc(txt) {
  if (!txt || !txt.trim()) throw new Error('nada foi colado.');
  let s = txt.trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  const iObj = s.indexOf('{');
  const iArr = s.indexOf('[');
  let dados;
  if (iArr !== -1 && (iObj === -1 || iArr < iObj)) {
    const fim = s.lastIndexOf(']');
    if (fim <= iArr) throw new Error('não encontrei uma lista JSON válida.');
    dados = JSON.parse(s.slice(iArr, fim + 1));
  } else {
    const fim = s.lastIndexOf('}');
    if (iObj === -1 || fim <= iObj) throw new Error('não encontrei um objeto JSON no texto colado.');
    dados = JSON.parse(s.slice(iObj, fim + 1));
  }
  const lista = Array.isArray(dados) ? dados : dados.procedimentos;
  if (!Array.isArray(lista)) throw new Error('JSON sem a lista "procedimentos".');
  return { lista: lista, criadoEm: (dados && dados.criadoEm) || null };
}
function mesclarProc(lista, substituir, arquivarAusentes) {
  const agora = new Date().toISOString();
  if (substituir) {
    const idsAntigos = new Map(db.procedimentos.map((p) => [chaveNumero(p.numero), p.id]));
    db.procedimentos = lista.map((item) => {
      const r = normalizarProc(Object.assign({}, item));
      const k = chaveNumero(item.numero);
      if (!item.id && k && idsAntigos.has(k)) r.id = idsAntigos.get(k);
      return r;
    });
    touch();
    render();
    recado('Controle substituído: ' + lista.length + ' procedimentos. Vínculos com o mesmo número foram mantidos.');
    return;
  }
  let novos = 0, atualizados = 0, arquivados = 0, desarquivados = 0, semNumero = 0, voltaram = 0;
  const porChave = new Map();
  for (const p of db.procedimentos) { const k = chaveNumero(p.numero); if (k.length >= 4 && !porChave.has(k)) porChave.set(k, p); }
  const chavesRelatorio = new Set();
  for (const item of lista) {
    const k = chaveNumero(item.numero);
    if (k.length < 4) { semNumero++; continue; }
    chavesRelatorio.add(k);
    const existente = porChave.get(k);
    if (existente) {
      const volta = movimentoDepoisDoFeito(existente, item.evento);
      for (const cpo of CAMPOS_FONTE) { if (item[cpo] && (!Array.isArray(item[cpo]) || item[cpo].length)) existente[cpo] = item[cpo]; }
      if (volta) { existente.situacao = 'sem_triagem'; existente.situacaoEm = agora; voltaram++; }
      for (const cpo of CAMPOS_CONTROLE) { if (item[cpo] !== undefined && item[cpo] !== '' && item[cpo] !== false) existente[cpo] = item[cpo]; }
      if (existente.arquivado) { existente.arquivado = false; desarquivados++; }
      existente.alteradoEm = agora;
      atualizados++;
    } else {
      const novo = normalizarProc(Object.assign({ origem: 'importado' }, item));
      db.procedimentos.push(novo);
      porChave.set(k, novo);
      novos++;
    }
  }
  if (arquivarAusentes && chavesRelatorio.size > 0) {
    for (const p of db.procedimentos) {
      if (p.arquivado) continue;
      const k = chaveNumero(p.numero);
      if (k.length >= 4 && !chavesRelatorio.has(k)) { p.arquivado = true; p.alteradoEm = agora; arquivados++; }
    }
  }
  touch();
  render();
  let msg = novos + ' incluído(s), ' + atualizados + ' atualizado(s).';
  if (voltaram) msg += ' ' + voltaram + (voltaram === 1 ? ' voltou' : ' voltaram') + ' para "Sem triagem": estava(m) como feito(s) e o SIM registrou movimento depois.';
  if (desarquivados) msg += ' ' + desarquivados + ' desarquivado(s).';
  if (arquivados) msg += ' ' + arquivados + ' arquivado(s) por não constarem no relatório.';
  if (semNumero) msg += ' ' + semNumero + ' item(ns) sem número ignorado(s).';
  if (!arquivarAusentes) msg += ' Nada foi apagado.';
  recado(msg);
  return msg;
}

/* prévia da mesclagem: o que muda, sem mexer em nada */
function previaMesclagem(lista, arquivarAusentes) {
  const porChave = new Map();
  for (const p of db.procedimentos) { const k = chaveNumero(p.numero); if (k.length >= 4 && !porChave.has(k)) porChave.set(k, p); }
  const novos = new Map(), atualizados = new Set(), desarquivados = new Set(), chaves = new Set(), voltam = new Set();
  let semNumero = 0;
  for (const item of lista) {
    const k = chaveNumero(item.numero);
    if (k.length < 4) { semNumero++; continue; }
    chaves.add(k);
    const ex = porChave.get(k);
    if (ex) { atualizados.add(ex); if (ex.arquivado) desarquivados.add(ex); if (movimentoDepoisDoFeito(ex, item.evento)) voltam.add(ex); }
    else if (!novos.has(k)) novos.set(k, item);
  }
  const arquivar = [];
  if (arquivarAusentes && chaves.size) {
    for (const p of db.procedimentos) {
      if (p.arquivado) continue;
      const k = chaveNumero(p.numero);
      if (k.length >= 4 && !chaves.has(k)) arquivar.push(p);
    }
  }
  return { novos: Array.from(novos.values()), atualizados: Array.from(atualizados), desarquivados: Array.from(desarquivados), arquivar: arquivar, semNumero: semNumero, voltam: Array.from(voltam) };
}

/* novo vínculo em um passo: uma busca só, papel em um clique, e cadastro ali mesmo se ainda não existir.

function formVinculo(origemId, pre) {
  const origem = achar(origemId);
  if (!origem) return;

  const tipos = tOrig === 'expediente' ? ['pessoa', 'entidade'] : ['expediente', 'pessoa', 'entidade'];
  const chaveDe = (tt) => (tt === 'pessoa' ? 'pessoas' : tt === 'entidade' ? 'entidades' : 'expedientes');
  const jaLigados = new Set(vincsIx(origemId).map((x) => x.outro.id));
  let selecionado = pre && pre.id ? achar(pre.id) : null;
  let itens = [];
  const buscaEl = el('input', { type: 'search', class: 'ix-vbusca', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Buscar quem vincular',
    placeholder: tOrig === 'expediente' ? 'Nome, CPF, CNPJ ou cargo da pessoa ou entidade…' : 'Número do expediente, nome, CPF ou CNPJ…' });
  const listaEl = el('div', { class: 'ix-vlista' });
  const selEl = el('div', { class: 'ix-vsel' });
  const papel = seletorPapel(pre ? pre.papel : '');
  const obsV = texto(pre ? pre.obs : '', { placeholder: 'opcional, ex.: assinou o contrato; citado às fls. 12' });
  const subDe = (i) => {
    const tt = tipoDe(i.id);
    if (tt === 'pessoa') return [i.cargo, i.orgao].filter(Boolean).join(' · ') || (i.cpf ? 'CPF ' + fmtDoc(i.cpf) : '');
    if (tt === 'entidade') return capitalizar(i.tipo) || (i.cnpj ? 'CNPJ ' + fmtDoc(i.cnpj) : '');
    return [i.status, fmtData(i.data)].filter(Boolean).join(' · ');
  };
  const escolher = (i, focarPapel) => {
    selecionado = i;
    buscaEl.value = '';
    desenhar();
    if (focarPapel) papel.focar();
  };
  const cadastrar = (tt) => {
    const q = buscaEl.value;
    const volta = { papel: papel.ler(), obs: obsV.value };
    const depois = (reg) => formVinculo(origemId, Object.assign({ id: reg.id }, volta));
    $('#dlg').close();
    if (tt === 'pessoa') formPessoa(null, preDaBusca(q, 'pessoa'), depois);
    else if (tt === 'entidade') formEntidade(null, preDaBusca(q, 'entidade'), depois);
    else formExpedienteIx(null, preDaBusca(q, 'expediente'), depois);
  };

    selEl.innerHTML = '';
    listaEl.innerHTML = '';
    if (selecionado) {
      selEl.className = 'ix-vsel on';
      selEl.append(iconeIx(tipoDe(selecionado.id)),
        el('div', { class: 'ix-vsel-tx' }, el('strong', {}, rotuloDe(selecionado)), el('span', { class: 'muted' }, jaLigados.has(selecionado.id) ? 'já tem vínculo com ' + rotuloDe(origem) + '; este será mais um papel' : subDe(selecionado))),
        el('button', { type: 'button', class: 'btn ghost sm', onclick: () => { selecionado = null; desenhar(); buscaEl.focus(); } }, 'Trocar'));
      buscaEl.hidden = true;
      return;
    }
    selEl.className = 'ix-vsel';
    buscaEl.hidden = false;
    const q = buscaEl.value;
    itens = [];
    if (!norm(q) && digits(q).length < 3) {
      listaEl.append(el('div', { class: 'muted ix-vdica' }, 'Digite para buscar. Se ainda não estiver no Índice, dá para cadastrar daqui.'));
      return;
    }
    const r = buscar(q);
    if (r) for (const tt of tipos) itens = itens.concat(r[chaveDe(tt)].filter((i) => i.id !== origemId));
    for (const i of itens.slice(0, 6)) {
      const b = el('button', { type: 'button', class: 'ix-vitem' },
        iconeIx(tipoDe(i.id)),
        el('span', { class: 'ix-vitem-tx' }, el('strong', {}, realcar(rotuloDe(i), norm(q))), el('span', { class: 'muted' }, subDe(i))),
        jaLigados.has(i.id) ? el('span', { class: 'ix-vja' }, 'já vinculado') : null);
      b.addEventListener('click', () => escolher(i, false));
      b.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        e.preventDefault();
        const bs = Array.from(listaEl.querySelectorAll('.ix-vitem'));
        const k = bs.indexOf(b) + (e.key === 'ArrowDown' ? 1 : -1);
        if (k < 0) buscaEl.focus(); else if (bs[k]) bs[k].focus();

    if (!itens.length) listaEl.append(el('div', { class: 'muted ix-vdica' }, 'Nada encontrado com "' + q.trim() + '".'));
    listaEl.append(el('div', { class: 'ix-vcad' }, el('span', { class: 'muted' }, itens.length ? 'Não é nenhum desses? Cadastrar:' : 'Cadastrar agora:'),
      ...tipos.map((tt) => el('button', { type: 'button', class: 'btn ghost sm', onclick: () => cadastrar(tt) }, tt === 'pessoa' ? '+ Pessoa' : tt === 'entidade' ? '+ Entidade' : '+ Expediente'))));
  };
  buscaEl.addEventListener('input', desenhar);
  buscaEl.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { const b = listaEl.querySelector('.ix-vitem'); if (b) { e.preventDefault(); b.focus(); } }
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();

    }
  });
  desenhar();
  abrirDialogo('Novo vínculo · ' + rotuloDe(origem), [
    campo(tOrig === 'expediente' ? 'Quem' : 'Com quem', el('div', {}, selEl, buscaEl, listaEl)),
    campo('Papel', papel.el),
    campo('Anotação', obsV)
  ], () => {
    if (!selecionado) { alert('Escolha com quem vincular.'); return false; }
    const pp = papel.ler();
    const igual = db.vinculos.find((v) =>
      ((v.origem === origemId && v.destino === selecionado.id) || (v.origem === selecionado.id && v.destino === origemId)) && papelCanonico(v.papel) === papelCanonico(pp));
    if (igual) { alert('Este vínculo, com este papel, já existe.'); return false; }
    db.vinculos.push({ id: uid('v'), origem: origemId, destino: selecionado.id, papel: pp, obs: obsV.value.trim() });
    touch();
    recado('Vínculo criado: ' + rotuloDe(selecionado) + (pp ? ' · ' + papelCanonico(pp) : '') + '.');
  }, 'Vincular');
  setTimeout(() => { if (selecionado) papel.focar(); else buscaEl.focus(); }, 50);
}

/* ---------- índice: colar bloco do Claude ---------- */
function parseBloco(txt) {
  if (!txt || !txt.trim()) throw new Error('nada foi colado.');
  let s = txt.trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  const ini = s.indexOf('{');
  const fim = s.lastIndexOf('}');
  if (ini === -1 || fim === -1 || fim <= ini) throw new Error('não encontrei um objeto JSON no texto colado.');
  const d = JSON.parse(s.slice(ini, fim + 1));
  for (const k of ['pessoas', 'entidades', 'expedientes', 'vinculos']) {
    if (d[k] !== undefined && !Array.isArray(d[k])) throw new Error('o campo "' + k + '" não está no formato de lista.');
  }
  return { pessoas: d.pessoas || [], entidades: d.entidades || [], expedientes: d.expedientes || [], vinculos: d.vinculos || [] };
}
function planejarImportacao(txt) {
  const b = parseBloco(txt);
  const plano = { itens: [], vincNovos: [], vincExistentes: 0, avisos: [], refMap: {} };
  let seq = 0;
  const registrar = (tipo, ref, existente, dados, rotuloNovo) => {
    const chave = ref || ('auto' + (++seq));
    plano.refMap[chave] = { tipo: tipo, existente: existente || null, dados: dados, novoId: null };
    plano.itens.push({ ref: chave, tipo: tipo, existente: existente || null, dados: dados, rotulo: rotuloNovo });
    return chave;
  };
  for (const p of b.pessoas) {
    const nome = sTrim(p.nome);
    if (!nome) { plano.avisos.push('Pessoa sem nome foi ignorada.'); continue; }
    const dados = { nome: nome, cpf: digits(p.cpf), cargo: sTrim(p.cargo), orgao: sTrim(p.orgao), aliases: aLista(p.aliases), obs: sTrim(p.obs) };
    const ex = pessoaPorCpf(dados.cpf, null) || porNomeIgual(db.pessoas, nome, null);
    registrar('pessoa', sTrim(p.ref), ex, dados, nome + (dados.cpf ? ' · CPF ' + fmtDoc(dados.cpf) : ''));
  }
  for (const e2 of b.entidades) {
    const nome = sTrim(e2.nome);
    if (!nome) { plano.avisos.push('Entidade sem nome foi ignorada.'); continue; }
    const dados = { nome: nome, cnpj: digits(e2.cnpj), tipo: sTrim(e2.tipo), aliases: aLista(e2.aliases), obs: sTrim(e2.obs) };
    const ex = entidadePorCnpj(dados.cnpj, null) || porNomeIgual(db.entidades, nome, null);
    registrar('entidade', sTrim(e2.ref), ex, dados, nome + (dados.cnpj ? ' · CNPJ ' + fmtDoc(dados.cnpj) : ''));
  }
  for (const x of b.expedientes) {
    const numero = sTrim(x.numero);
    if (!numero) { plano.avisos.push('Expediente sem número foi ignorado (e os vínculos dele também).'); continue; }
    const dados = { numero: numero, tipo: sTrim(x.tipo), data: sTrim(x.data), status: sTrim(x.status), temas: aLista(x.temas), resumo: sTrim(x.resumo), obs: sTrim(x.obs) };
    const ex = expedientePorNumero(numero, null);
    registrar('expediente', sTrim(x.ref), ex, dados, (dados.tipo || 'Expediente') + ' ' + numero);
  }
  for (const v of b.vinculos) {
    const o = plano.refMap[sTrim(v.origem)];
    const d2 = plano.refMap[sTrim(v.destino)];
    if (!o || !d2) { plano.avisos.push('Vínculo com referência desconhecida foi ignorado (' + sTrim(v.origem) + ' → ' + sTrim(v.destino) + ').'); continue; }
    const papel = sTrim(v.papel);
    if (o.existente && d2.existente) {
      const oId = o.existente.id, dId = d2.existente.id;
      const ja = db.vinculos.find((w) => ((w.origem === oId && w.destino === dId) || (w.origem === dId && w.destino === oId)) && norm(w.papel) === norm(papel));
      if (ja) { plano.vincExistentes++; continue; }
    }
    const rep = plano.vincNovos.find((w) => ((w.origem === sTrim(v.origem) && w.destino === sTrim(v.destino)) || (w.origem === sTrim(v.destino) && w.destino === sTrim(v.origem))) && norm(w.papel) === norm(papel));
    if (rep) continue;
    plano.vincNovos.push({ origem: sTrim(v.origem), destino: sTrim(v.destino), papel: papel, obs: sTrim(v.obs) });
  }
  if (!plano.itens.length && !plano.vincNovos.length) throw new Error('o bloco não trouxe nenhum registro aproveitável.');
  return plano;
}
function completarExistente(ex, dados, tipo) {
  const camposTexto = tipo === 'expediente' ? ['tipo', 'data', 'status', 'resumo', 'obs'] : tipo === 'pessoa' ? ['cpf', 'cargo', 'orgao', 'obs'] : ['cnpj', 'tipo', 'obs'];
  let mudou = false;
  for (const c of camposTexto) {
    if (!sTrim(ex[c]) && sTrim(dados[c])) { ex[c] = dados[c]; mudou = true; }
  }
  const uniao = (campoNome) => {
    const atual = ex[campoNome] || [];
    const atuaisN = atual.map(norm);
    for (const item of (dados[campoNome] || [])) {
      if (atuaisN.indexOf(norm(item)) === -1) { atual.push(item); atuaisN.push(norm(item)); mudou = true; }
    }
    ex[campoNome] = atual;
  };
  if (tipo === 'expediente') uniao('temas'); else uniao('aliases');
  if (tipo !== 'expediente' && sTrim(dados.nome) && norm(ex.nome) !== norm(dados.nome)) {
    const aliases = ex.aliases || [];
    if (aliases.map(norm).indexOf(norm(dados.nome)) === -1) { aliases.push(dados.nome); ex.aliases = aliases; mudou = true; }
  }
  return mudou;
}
function aplicarImportacao(plano) {
  let criados = 0, completados = 0;
  for (const item of plano.itens) {
    const reg = plano.refMap[item.ref];
    if (reg.existente) {
      if (completarExistente(reg.existente, reg.dados, reg.tipo)) completados++;
      reg.novoId = reg.existente.id;
    } else {
      const prefixo = reg.tipo === 'pessoa' ? 'p' : reg.tipo === 'entidade' ? 'e' : 'x';
      const lista = reg.tipo === 'pessoa' ? 'pessoas' : reg.tipo === 'entidade' ? 'entidades' : 'expedientes';
      const novo = Object.assign({ id: uid(prefixo) }, reg.dados);
      db[lista].push(novo);
      reg.novoId = novo.id;
      criados++;
    }
  }
  let vincs = 0;
  for (const v of plano.vincNovos) {
    const oId = plano.refMap[v.origem].novoId;
    const dId = plano.refMap[v.destino].novoId;
    const ja = db.vinculos.find((w) => ((w.origem === oId && w.destino === dId) || (w.origem === dId && w.destino === oId)) && norm(w.papel) === norm(v.papel));
    if (ja) continue;
    db.vinculos.push({ id: uid('v'), origem: oId, destino: dId, papel: v.papel, obs: v.obs });
    vincs++;
  }
  touch();
  const exps = plano.itens.filter((i) => i.tipo === 'expediente');
  if (exps.length === 1) { S.aba = 'indice'; IX.view = 'ficha'; IX.fichaId = plano.refMap[exps[0].ref].novoId; pilhaIx.length = 0; }
  render();
  window.scrollTo(0, 0);
  return { criados: criados, completados: completados, vincs: vincs };
}

        for (const id of ps) { if (!porProc.has(id)) porProc.set(id, []); porProc.get(id).push(t2); }

      const prazoMin = (itens) => Math.min(...itens.map((t2) => { const d = paraData(t2.dataLimite); return d ? +d : Infinity; }));
      const ids = Array.from(porProc.keys()).sort((a, b) => prazoMin(porProc.get(a)) - prazoMin(porProc.get(b)) || (acharProc(a).numero || '').localeCompare(acharProc(b).numero || ''));
      for (const id of ids) grupo('tk:p:' + id, rotuloProcCurto(acharProc(id)), porProc.get(id).sort(porPrazo), { proc: acharProc(id) });
      if (sem.length) grupo('tk:p:-', 'Sem procedimento', sem.sort(porPrazo));
    } else if (ST.agrupar === 'reuniao') {
      const porReu = new Map();
      const sem = [];
      for (const t2 of lista) { const r = t2.reuniaoId ? acharReuniao(t2.reuniaoId) : null; if (!r) { sem.push(t2); continue; } if (!porReu.has(r.id)) porReu.set(r.id, []); porReu.get(r.id).push(t2); }
      const ids = Array.from(porReu.keys()).sort((a, b) => (paraData(acharReuniao(b).data) || 0) - (paraData(acharReuniao(a).data) || 0));
      for (const id of ids) { const r = acharReuniao(id); grupo('tk:r:' + id, 'Reunião de ' + r.data + (r.titulo ? ' · ' + r.titulo : ''), porReu.get(id).sort(porPrazo), { reuniao: r }); }
      if (sem.length) grupo('tk:r:-', 'Fora de reunião', sem.sort(porPrazo));
    } else {
      const b = { venc: [], hoje: [], prox: [], folg: [], sem: [] };
      const reus = new Map();
      for (const t2 of lista) {
        if (t2.reuniaoId && !t2.dataLimite) {
          const r = acharReuniao(t2.reuniaoId);
          const k = r ? r.id : '?';
          if (!reus.has(k)) reus.set(k, { r: r, itens: [] });
          reus.get(k).itens.push(t2);
          continue;
        }
        const f = faixaPorData(t2);
        (b[f] || b.sem).push(t2);
      }
      grupo('tk:atrasadas', 'Atrasadas', b.venc.sort(porPrazo), { classe: 'g-venc' });
      grupo('tk:hoje', 'Hoje', b.hoje.sort(porPrazo), { classe: 'g-sete' });
      const rs = Array.from(reus.values()).sort((x, y) => (paraData(y.r && y.r.data) || 0) - (paraData(x.r && x.r.data) || 0));
      for (const x of rs) grupo('tk:reu:' + (x.r ? x.r.id : '?'), 'Da reunião de ' + (x.r ? x.r.data : '?'), x.itens.sort(porPrazo), { reuniao: x.r, semReuniao: true });
      grupo('tk:prox', 'Próximos 7 dias', b.prox.sort(porPrazo));
      grupo('tk:folg', 'Futuras', b.folg.sort(porPrazo));
      grupo('tk:sem', 'Sem prazo', b.sem.sort(porPrazo));
    }
    for (const g of grupos) {
      if (!g.itens.length) continue;
      const fechado = dobradas.has(g.chave);
      const cab = el('button', { type: 'button', class: 'c-grupo tk-grupo' + (g.classe ? ' ' + g.classe : ''), 'aria-expanded': String(!fechado) },
        el('span', { class: 'seta-dobra' }, fechado ? '▸' : '▾'), g.titulo, el('span', { class: 'c-grupo-n' }, String(g.itens.length)),
        g.proc ? el('span', { class: 'tk-grupo-sub' }, recorte(tituloVisivel(g.proc), 70)) : null, el('span', { class: 'srule' }));
      cab.addEventListener('click', () => { if (dobradas.has(g.chave)) dobradas.delete(g.chave); else dobradas.add(g.chave); desenharLista(); });
      const linhaCab = el('div', { class: 'tk-grupo-l' }, cab);
      if (g.proc) linhaCab.append(el('button', { type: 'button', class: 'tk-grupo-ir', title: 'Abrir no Controle', onclick: () => abrirProc(g.proc.id) }, 'Controle ↗'));
      if (g.reuniao) linhaCab.append(el('button', { type: 'button', class: 'tk-grupo-ir', title: 'Abrir a reunião', onclick: () => abrirReuniao(g.reuniao) }, 'Reunião ↗'));
      listaBox.append(linhaCab);
      if (!fechado) listaBox.append(painelTk(g.itens.map((t2) => linhaTarefa(t2, { termo: termo, semReuniao: g.semReuniao || !!g.reuniao, semProc: !!g.proc && (t2.procedimentoIds || []).length === 1 }))));
    }
  };
  busca.addEventListener('input', () => { ST.busca = busca.value; desenharLista(); });
  busca.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { const r = listaBox.querySelector('.tk-row'); if (r) { e.preventDefault(); r.focus(); } } });
  selAgr.addEventListener('change', () => { ST.agrupar = selAgr.value; guardarPrefTarefas(); desenharLista(); });
  desenharLista();
  return c;
}
function formTarefa(t2, preNova) {
  const txt = areaTexto(t2 && t2.texto, 3);
  txt.placeholder = 'O que precisa ser feito?';
  const dataL = el('input', { type: 'date', value: t2 && t2.dataLimite ? paraISO(t2.dataLimite) : '' });
  const cat = texto(t2 && t2.categoria, { placeholder: 'ex.: minutar, requisitar', list: 'dl-categorias', autocomplete: 'off' });
  const dlc = $('#dl-categorias');
  if (dlc) { dlc.innerHTML = ''; const vistas = new Map(); for (const x of db.tarefas) { const k = norm(x.categoria); if (k && !vistas.has(k)) vistas.set(k, x.categoria.trim()); } for (const v of Array.from(vistas.values()).sort((a, b) => a.localeCompare(b, 'pt-BR'))) dlc.append(el('option', { value: v })); }
  const det = areaTexto(t2 && t2.detalhe, 6);
  det.placeholder = 'Opcional. Passo a passo, construção do despacho, o que a Promotora pediu.';
  const procBox = el('div');
  const selProc = seletorProc(procBox, t2 && t2.procedimentoIds);
  const campos = [
    campo('Tarefa *', txt),
    el('div', { class: 'grid2' }, campo('Prazo', dataL), campo('Categoria', cat)),
    campo('Detalhe', det),
    campo('Procedimento vinculado', procBox, 'Opcional. Vincula a tarefa a um processo do controle.')
  ];
  if (t2 && t2.expedienteRef && !(t2.procedimentoIds || []).length) campos.push(el('div', { class: 'muted', style: 'font-size:12.5px' }, 'Expediente citado na reunião: ' + t2.expedienteRef + ' (não está no Controle).'));
  const reu = t2 && t2.reuniaoId ? acharReuniao(t2.reuniaoId) : null;
  if (reu) campos.push(el('div', { class: 'muted', style: 'font-size:12.5px' }, 'Veio da reunião de ' + reu.data + (reu.titulo ? ' · ' + reu.titulo : '') + '.'));
  abrirDialogo(t2 && !preNova ? 'Editar tarefa' : 'Nova tarefa', campos, () => {
    const tx = txt.value.trim();
    if (!tx) { alert('Informe a tarefa.'); return false; }
    if (t2 && !preNova) {
      t2.texto = tx;
      t2.detalhe = det.value.trim();
      t2.dataLimite = dataL.value ? paraBR(dataL.value) : '';
      t2.categoria = cat.value.trim();
      t2.procedimentoIds = selProc.getIds();
    } else if (preNova && t2) {
      t2.texto = tx;
      t2.detalhe = det.value.trim();
      t2.dataLimite = dataL.value ? paraBR(dataL.value) : '';
      t2.categoria = cat.value.trim();
      t2.procedimentoIds = selProc.getIds();
      t2.ordem = proximaOrdem(db.tarefas);
      db.tarefas.push(t2);
    } else {
      db.tarefas.push(normTarefa({ texto: tx, detalhe: det.value.trim(), dataLimite: dataL.value ? paraBR(dataL.value) : '', categoria: cat.value.trim(), procedimentoIds: selProc.getIds(), ordem: proximaOrdem(db.tarefas) }));
    }
    touch();
  });
  setTimeout(() => txt.focus(), 50);
}

/* --- lembretes --- */
function telaLembretes() {
  const c = el('div');
  c.append(barraRapida('lembrete'));
  const todos = db.lembretes.slice().sort((a, b) => {
    const da = paraData(a.data), dbb = paraData(b.data);
    if (!da && !dbb) return 0; if (!da) return 1; if (!dbb) return -1;
    return da - dbb;
  });
  if (!todos.length) {
    c.append(el('div', { class: 'c-vazio' }, el('p', {}, 'Nenhum lembrete. Escreva acima, por exemplo "Conferir o Diário Oficial todo dia".')));
    return c;
  }
  const grupos = { passados: [], hoje: [], proximos: [], futuros: [], semData: [], dispensados: [] };
  for (const l of todos) {
    if (!l.ativo) { grupos.dispensados.push(l); continue; }
    const d = diasLembrete(l);
    if (d === null) grupos.semData.push(l);
    else if (d < 0) grupos.passados.push(l);
    else if (d === 0) grupos.hoje.push(l);
    else if (d <= 7) grupos.proximos.push(l);
    else grupos.futuros.push(l);
  }
  const defs = [
    ['lb:passados', 'Passados', grupos.passados, 'g-venc'],
    ['lb:hoje', 'Hoje', grupos.hoje, 'g-sete'],
    ['lb:proximos', 'Próximos 7 dias', grupos.proximos, ''],
    ['lb:futuros', 'Futuros', grupos.futuros, ''],
    ['lb:semData', 'Sem data', grupos.semData, ''],
    ['lb:dispensados', 'Dispensados', grupos.dispensados, 'apagado']
  ];
  for (const g of defs) {
    if (!g[2].length) continue;
    /* dispensados começam fechados */
    const fechado = g[0] === 'lb:dispensados' ? !dobradas.has('lb:dispensados:aberto') : dobradas.has(g[0]);
    const cab = el('button', { type: 'button', class: 'c-grupo tk-grupo' + (g[3] ? ' ' + g[3] : ''), 'aria-expanded': String(!fechado) },
      el('span', { class: 'seta-dobra' }, fechado ? '▸' : '▾'), g[1], el('span', { class: 'c-grupo-n' }, String(g[2].length)), el('span', { class: 'srule' }));
    cab.addEventListener('click', () => {
      const k = g[0] === 'lb:dispensados' ? 'lb:dispensados:aberto' : g[0];
      if (dobradas.has(k)) dobradas.delete(k); else dobradas.add(k);
      render();
    });
    c.append(el('div', { class: 'tk-grupo-l' }, cab));
    if (!fechado) c.append(painelTk(g[2].map((l) => linhaLembrete(l))));
  }
  return c;
}

    } else {
      db.lembretes.push(normLembrete({ texto: tx, data: dataL.value ? paraBR(dataL.value) : '', recorrencia: rec.value.trim(), procedimentoIds: selProcL.getIds() }));
    }
    touch();
  });
  setTimeout(() => txt.focus(), 50);
}

/* ---------- absorver bases antigas ---------- */
function absorverConteudo(dados) {
  let d;
  try { d = JSON.parse(dados); } catch (e) { alert('O arquivo não é um JSON válido: ' + e.message); return; }
  const relat = [];
  const temGuia = Array.isArray(d.etapas) && d.etapas.length;
  const temItens = Array.isArray(d.itens) && d.itens.length;
  if (temGuia || temItens) {
    if (!db.etapas.length && !db.itens.length && temGuia) {
      db.etapas = d.etapas;
      db.itens = Array.isArray(d.itens) ? d.itens : [];
      relat.push('Guia: ' + db.etapas.length + ' etapa(s) e ' + db.itens.length + ' item(ns) absorvidos.');
    } else {
      relat.push('Guia: ignorado (a base atual já tem conteúdo de guia; nada foi sobrescrito).');
    }
  }
  if (Array.isArray(d.procedimentos) && d.procedimentos.length) {
    if (!db.procedimentos.length) {
      db.procedimentos = d.procedimentos.map(normalizarProc);
      relat.push('Controle: ' + db.procedimentos.length + ' procedimento(s) absorvido(s).');
    } else {
      relat.push('Controle: ignorado (a base atual já tem procedimentos; use "Importar JSON" da aba Controle para mesclar).');
    }
  }
  const temIndice = ['pessoas', 'entidades', 'expedientes'].some((k) => Array.isArray(d[k]) && d[k].length);
  if (temIndice) {
    const vazioIx = !db.pessoas.length && !db.entidades.length && !db.expedientes.length && !db.vinculos.length;
    if (vazioIx) {
      db.pessoas = d.pessoas || [];
      db.entidades = d.entidades || [];
      db.expedientes = d.expedientes || [];
      db.vinculos = d.vinculos || [];
      relat.push('Índice: ' + db.pessoas.length + ' pessoa(s), ' + db.entidades.length + ' entidade(s), ' + db.expedientes.length + ' expediente(s) e ' + db.vinculos.length + ' vínculo(s) absorvidos.');
    } else {
      relat.push('Índice: ignorado (a base atual já tem registros do índice; nada foi sobrescrito).');
    }
  }
  if (!relat.length) { alert('O arquivo não trouxe nenhum conteúdo reconhecível (guia, controle ou índice).'); return; }
  touch();
  render();
  alert(relat.join('\n'));
}
async function absorverBaseAntiga() {
  if (!db) { alert('Abra ou crie a base combinada antes de absorver.'); return; }
  if (FS_OK) {
    try {
      const sel = await window.showOpenFilePicker({ types: [{ description: 'Base antiga (.json)', accept: { 'application/json': ['.json'] } }] });
      const f = await sel[0].getFile();
      absorverConteudo(await f.text());
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      alert('Não foi possível abrir: ' + e.message);
    }
    return;
  }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (f) absorverConteudo(await f.text());
  };
  inp.click();
}

  const escuro = document.body.classList.contains('dark');

  aplicarTema();
}

document.getElementById('toggle-tema').addEventListener('click', alternarTema);
