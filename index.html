<style>
:root{
  --paper:#f5f6fa;
  --card:#ffffff;
  --ink:#111318;
  --muted:#5c6170;
  --line:#e5e7ec;
  --line-forte:#cdd0d8;
  --accent:#a02540;
  --accent-escuro:#871f36;
  --accent-soft:#faeef1;
  --chip:#eff0f3;
  --aviso-bg:#fff8e1;
  --aviso-borda:#efdf9e;
  --sombra:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --sombra-alta:0 4px 20px rgba(0,0,0,.12);
  --raio:14px;
  --t-regra:#a02540;      --t-regra-bg:#faeef1;
  --t-pratica:#237a4b;    --t-pratica-bg:#e8f6ee;
  --t-ferramenta:#2160a4; --t-ferramenta-bg:#e9f1fb;
  --t-modelo:#8f6414;     --t-modelo-bg:#faf3df;
  --t-atencao:#b45309;    --t-atencao-bg:#fdf0e1;
  --t-checklist:#727782;  --t-checklist-bg:#eff0f3;
  --t-promotora:#7248b8;  --t-promotora-bg:#f2edfb;
  --c-regra:var(--t-regra);
  --c-pratica:var(--t-pratica);
  --c-ferramenta:var(--t-ferramenta);
  --c-modelo:var(--t-modelo);
  --c-atencao:var(--t-atencao);
  --c-checklist:var(--t-checklist);
}
.dark{
  --paper:#1a2030;
  --card:#212a3c;
  --ink:#e6e8ee;
  --muted:#98a0b4;
  --line:#2e3748;
  --line-forte:#3e4a60;
  --accent:#f07088;
  --accent-escuro:#f8909e;
  --accent-soft:#3a2535;
  --chip:#283248;
  --aviso-bg:#2e2c20;
  --aviso-borda:#5e5838;
  --sombra:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
  --sombra-alta:0 10px 34px rgba(0,0,0,.5);
  --t-regra:#f4869a;      --t-regra-bg:#3a2530;
  --t-pratica:#88d4a8;    --t-pratica-bg:#1e3830;
  --t-ferramenta:#8ac0f0; --t-ferramenta-bg:#1e3048;
  --t-modelo:#e8c478;     --t-modelo-bg:#383218;
  --t-atencao:#f4b060;    --t-atencao-bg:#383018;
  --t-checklist:#98a0b4;  --t-checklist-bg:#283248;
  --t-promotora:#c0a4f0;  --t-promotora-bg:#2a2848;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-weight:650;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;font-size:.93em}
.muted{color:var(--muted)}
.oculto{display:none !important}
::selection{background:var(--accent-soft)}

/* cabeçalho */
header{background:var(--card);padding:12px 24px 0}
.head-inner{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
h1.app-title{font-size:19px;margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.base-box{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.base-info{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
#base-nome{font-size:12px;font-weight:600}
#base-status{font-size:11.5px;color:var(--muted)}
#base-status.alerta-txt{color:var(--accent);font-weight:600}
.base-acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* abas */
.abas{max-width:1120px;margin:0 auto;padding:10px 24px 12px;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.abas-inner{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
header + .abas{margin-top:0}
.aba{appearance:none;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:7px 15px;border-radius:9px;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.aba svg{width:15px;height:15px;flex:none}
.aba:hover{color:var(--ink)}
.aba.ativa{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.aba.ativa svg{color:var(--accent)}
.aba:active{transform:scale(.97)}
.aba.desligada{opacity:.4;cursor:default}
.cont{display:inline-block;margin-left:7px;background:var(--chip);border-radius:999px;font-size:10.5px;padding:1px 8px;color:var(--muted);font-weight:600;vertical-align:1px}
.aba.ativa .cont{background:var(--accent-soft);color:var(--accent)}

.faixa{max-width:1120px;margin:0 auto;padding:14px 24px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.toggle-edicao{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.toggle-edicao input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.toggle-edicao.ligado{color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding:20px 24px 80px}
footer{max-width:1120px;margin:0 auto;padding:16px 24px 36px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

/* botões */
.btn{appearance:none;cursor:pointer;border-radius:10px;font-weight:600;font-size:13px;padding:8px 16px;border:1px solid transparent;font-family:inherit;transition:all .15s}
.btn.sm{font-size:12.5px;padding:6px 11px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-escuro)}
.btn.ghost{background:transparent;border-color:var(--line-forte);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.perigo{background:transparent;border-color:var(--line-forte);color:var(--accent)}
.btn.perigo:hover{background:var(--accent-soft);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.toggle-tema{appearance:none;border:0;background:transparent;cursor:pointer;font-size:16px;padding:4px 8px;line-height:1;border-radius:8px;color:var(--muted)}
.toggle-tema:hover{background:var(--chip);color:var(--ink)}

/* menu "Mais" */
.menu-wrap{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sombra-alta);min-width:230px;padding:6px;display:none;z-index:70}
.menu-pop.aberto{display:block}
.menu-item{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink);padding:9px 12px;border-radius:8px}
.menu-item:hover{background:var(--paper);color:var(--accent)}

/* busca e filtros */
input.busca{width:100%;font-size:14.5px;padding:11px 16px;border:1px solid var(--line-forte);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;box-shadow:var(--sombra);transition:border-color .12s,box-shadow .12s}
input.busca:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
input.busca::placeholder{color:var(--muted)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.filtro-chip{appearance:none;cursor:pointer;background:transparent;border:1px solid var(--line-forte);border-radius:10px;padding:5px 14px;font-size:12.5px;font-weight:600;font-family:inherit;color:var(--muted);transition:all .15s}
.filtro-chip:hover{border-color:var(--muted);color:var(--ink)}
.filtro-chip.ativa{border-color:var(--ink);color:var(--card);background:var(--ink)}
.dica{font-size:13.5px;margin:16px 2px;color:var(--muted)}

/* guia: catálogo de tópicos */
.catalogo{display:grid;gap:10px;margin-top:16px}
.cat-item{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);overflow:hidden;box-shadow:var(--sombra);transition:border-color .12s}
.cat-item.aberto{border-color:var(--accent)}
.cat-cab{display:flex;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;user-select:none}
.cat-cab:hover .cat-nome{color:var(--accent)}
.cat-nome{font-weight:650;font-size:15px;flex:1;letter-spacing:-.01em}
.cat-obj{font-size:12.5px;color:var(--muted);margin-top:2px}
.cat-lado{display:flex;align-items:center;gap:12px;flex-shrink:0}
.cat-cont{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--chip);border-radius:999px;padding:2px 9px}
.chev{color:var(--muted);font-size:11px;transition:transform .15s}
.cat-item.aberto .chev{transform:rotate(90deg);color:var(--accent)}
.cat-corpo{border-top:1px solid var(--line);padding:6px 18px 16px;background:var(--card)}
.cat-rodape{margin-top:8px}

.sec-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h.dobravel{cursor:pointer;user-select:none}
.sec-h.dobravel:hover{color:var(--accent)}
.seta-dobra{display:inline-block;width:12px;font-size:10px;color:var(--muted)}
.sec-add{margin-left:auto}

/* itens do guia e do índice */
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,box-shadow .12s}
.item:hover{border-color:var(--line-forte)}
.item.destacado{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item-corpo{flex:1;min-width:0}
.item-texto{font-size:14px;white-space:pre-wrap}
.item-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-fonte{font-style:normal;opacity:.85}
.item-acoes{display:flex;gap:2px;flex-shrink:0}
.btn-mini{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:4px 6px;border-radius:6px;font-family:inherit;transition:all .12s}
.btn-mini:hover{color:var(--accent);background:var(--accent-soft)}

/* etiquetas tintadas */
.tag{display:inline-block;border:0;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.regra{color:var(--t-regra);background:var(--t-regra-bg)}
.tag.pratica{color:var(--t-pratica);background:var(--t-pratica-bg)}
.tag.ferramenta{color:var(--t-ferramenta);background:var(--t-ferramenta-bg)}
.tag.modelo{color:var(--t-modelo);background:var(--t-modelo-bg)}
.tag.atencao{color:var(--t-atencao);background:var(--t-atencao-bg)}
.tag.checklist{color:var(--t-checklist);background:var(--t-checklist-bg)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
.chip.prazo{background:transparent;border:1px solid var(--line-forte);color:var(--muted)}
.chip.st{background:var(--chip);color:var(--muted)}
.chip.papel{background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700;border-radius:6px;padding:2px 8px}
.chip.clique{cursor:pointer;background:var(--chip);color:var(--ink);font-family:inherit;border:0}
.chip.clique:hover{background:var(--accent-soft);color:var(--accent)}
.check-caixa{width:16px;height:16px;accent-color:var(--accent);margin-top:3px;cursor:pointer;flex-shrink:0}
.item.marcado .item-texto{text-decoration:line-through;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:16px 18px;margin:12px 0;box-shadow:var(--sombra)}
.aviso{background:var(--aviso-bg);border:1px solid var(--aviso-borda);border-radius:10px;padding:10px 14px;font-size:13px;margin:8px 0}
.inicio h2{font-size:20px;margin:8px 0 6px;font-weight:700;letter-spacing:-.01em}
.inicio p{max-width:640px;color:var(--muted)}
.acoes-inicio{display:flex;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.vazio{max-width:520px;margin:48px auto;text-align:center}
.vazio h2{font-size:19px;margin:0 0 6px;font-weight:700}
.vazio p{color:var(--muted);font-size:14px}
.vazio .acoes-inicio{justify-content:center}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;max-width:600px;width:94vw;background:var(--card);color:var(--ink);box-shadow:var(--sombra-alta)}
dialog::backdrop{background:rgba(15,17,22,.5)}
.d-head{padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;letter-spacing:-.01em}
.d-body{padding:18px 20px;display:grid;gap:14px;max-height:70vh;overflow:auto}
.d-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.campo label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.campo input,.campo textarea,.campo select{width:100%;font-size:14px;padding:9px 12px;border:1px solid var(--line-forte);border-radius:9px;background:var(--card);font-family:inherit;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.campo textarea{resize:vertical}
.campo-dica{font-size:12px;margin-top:5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mapa-grupo{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;background:var(--paper)}
.mapa-nome{font-weight:650;font-size:14px}

/* controle */
.c-barra{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.c-barra input[type=search]{flex:1;min-width:180px;font-size:13.5px;padding:8px 12px;border:1px solid var(--line-forte);border-radius:10px;background:var(--card);font-family:inherit;color:var(--ink)}
.c-barra input[type=search]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.c-barra select{font-size:12.5px;padding:8px 10px;border:1px solid var(--line-forte);border-radius:9px;background:var(--card);font-family:inherit;color:var(--ink);max-width:220px}
.c-filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 6px}
.c-filtros select{font-size:12.5px;padding:7px 10px;border:1px solid var(--line-forte);border-radius:9px;background:var(--card);font-family:inherit;color:var(--ink)}
.painel{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.painel button{appearance:none;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 14px;text-align:left;font-family:inherit;color:var(--ink);min-width:90px;transition:border-color .12s}
.painel button:hover{border-color:var(--accent);box-shadow:var(--sombra)}
.painel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.painel .n{display:block;font-size:17px;font-weight:700;line-height:1.2}
.painel .r{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.painel .venc .n{color:var(--t-regra)}
.painel .prox .n{color:var(--t-atencao)}
.painel .folg .n{color:var(--t-pratica)}

.proc-lista{display:grid;gap:8px}
.proc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:all .15s}
.proc-card:hover{border-color:var(--accent);box-shadow:var(--sombra)}
.proc-card.arquivado{opacity:.5}
.proc-faixa{width:3px;min-width:3px;border-radius:3px;align-self:stretch;flex-shrink:0}
.proc-faixa.venc{background:var(--t-regra)}
.proc-faixa.prox{background:var(--t-atencao)}
.proc-faixa.folg{background:var(--t-pratica)}
.proc-check{flex-shrink:0;margin-top:1px}
.proc-info{flex:1;min-width:0}
.proc-topo{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.proc-num{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:13px;font-weight:600}
.proc-classe{font-size:11.5px;color:var(--muted)}
.proc-titulo{font-size:14px;margin-top:3px;line-height:1.4}
.proc-assunto{font-size:11.5px;color:var(--muted);margin-top:2px}
.proc-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chip-sit{display:inline-block;border:0;border-radius:6px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.proc-prazo{font-size:11.5px;font-weight:600}
.proc-prazo.venc{color:var(--t-regra)}
.proc-prazo.prox{color:var(--t-atencao)}
.proc-prazo.folg{color:var(--t-pratica)}
.proc-prazo.nulo{color:var(--muted);font-weight:500}
.vinc-badge{font-size:11px;color:var(--accent);font-weight:600;opacity:.7}
.idx-badge{font-size:10px;color:var(--t-atencao);font-weight:600;opacity:.7}
.proc-acao{font-size:12.5px;color:var(--muted);margin-top:3px}
.proc-ordenar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px;align-items:center;font-size:11.5px;color:var(--muted)}
.proc-ord-btn{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:6px}
.proc-ord-btn:hover{color:var(--accent);background:var(--accent-soft)}
.proc-ord-btn.ativo{color:var(--accent)}
.s-sem_triagem{color:var(--t-checklist);background:var(--t-checklist-bg)}
.s-analise{color:var(--t-ferramenta);background:var(--t-ferramenta-bg)}
.s-aguardando{color:var(--t-atencao);background:var(--t-atencao-bg)}
.s-minutar{color:var(--t-regra);background:var(--t-regra-bg)}
.s-promotora{color:var(--t-promotora);background:var(--t-promotora-bg)}
.s-concluido{color:var(--t-pratica);background:var(--t-pratica-bg)}

.bandeira{font-size:13px}
.b-alta{color:var(--t-regra)}
.b-normal{color:var(--t-atencao)}
.c-contagem{font-size:12px;color:var(--muted);margin:10px 2px}

/* gaveta */
.fundo{position:fixed;inset:0;background:rgba(15,17,22,.45);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.fundo.aberta{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--sombra-alta);transform:translateX(103%);transition:transform .22s cubic-bezier(.22,.68,.36,1);z-index:50;display:flex;flex-direction:column}
.gaveta.aberta{transform:translateX(0)}
.g-cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.g-numero{font-size:15px;font-weight:700}
.g-corpo{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:14px}
.g-pe{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}
.bloco-g{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--paper)}
.bloco-g h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.evento-txt{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--ink)}

.salvar-float{position:fixed;bottom:24px;right:24px;z-index:38;appearance:none;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;font-family:inherit;box-shadow:var(--sombra-alta);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;transform:translateY(8px)}
.salvar-float.visivel{opacity:1;pointer-events:auto;transform:translateY(0)}
.salvar-float:hover{background:var(--accent-escuro)}
/* métricas */
.metricas{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:12px 16px;margin:0 0 10px;box-shadow:var(--sombra)}
.metricas h3{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chart-dias{display:flex;gap:3px;align-items:flex-end;height:56px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.chart-bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px;transition:height .2s}
.chart-bar.zero{background:var(--line);min-height:2px}
.chart-bar.hoje{background:var(--t-pratica)}
.chart-n{font-size:11px;font-weight:700;color:var(--ink)}
.chart-d{font-size:10px;color:var(--muted)}
.chart-total{display:flex;gap:20px;margin-top:12px;font-size:13px;color:var(--muted)}
.chart-total strong{color:var(--ink);font-weight:700}
/* tarefas e lembretes (estilo Central) */
.t-qadd{display:flex;gap:8px;margin:10px 0 14px;align-items:center}
.t-qadd .t-inp{flex:1;background:var(--card);border:1px solid var(--line-forte);border-radius:9px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--ink)}
.t-qadd .t-inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.t-qadd .t-inp::placeholder{color:var(--muted)}
.t-qadd input[type="date"]{width:auto;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--line-forte);border-radius:9px;padding:7px 10px;color:var(--ink)}
.t-filtros{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.seclab{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin:24px 0 8px}
.seclab:first-child{margin-top:4px}
.seclab .sn{color:var(--ink);font-weight:600}
.seclab .srule{flex:1;height:1px;background:var(--line)}
.seclab.danger,.seclab.danger .sn{color:var(--t-regra)}
.tlist{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);overflow:hidden;margin-bottom:14px}
.trow{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:background .1s}
.trow + .trow{border-top:1px solid var(--line)}
.trow:hover{background:var(--paper)}
.trow.done .tt{color:var(--muted);text-decoration:line-through}
.ck{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid var(--line-forte);background:none;padding:0;position:relative;cursor:pointer;appearance:none}
.ck:hover{background:var(--chip)}
.ck.on{background:var(--ink);border-color:var(--ink)}
.ck.on::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:12px;font-weight:700}
.ck.pop{animation:ckpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes ckpop{0%{transform:scale(.3) rotate(-15deg)}50%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.tt{flex:1;min-width:0;font-weight:500}
.tmeta{display:flex;gap:8px;align-items:center;flex:none}
.due{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.due.late{color:var(--t-regra);font-weight:600}
.due.soon{color:var(--t-atencao);font-weight:600}
.due.ok{color:var(--t-pratica)}
.t-cat{font-family:"JetBrains Mono",Consolas,monospace;font-size:10.5px;color:var(--muted);background:var(--chip);border-radius:5px;padding:2px 7px}
.t-acoes{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .12s}
.trow:hover .t-acoes{opacity:1}
.lem-flag{flex:none;width:20px;text-align:center;font-size:14px}
.trow.lem-ack .tt{color:var(--muted);text-decoration:line-through}
.trow.lem-ack .lem-flag{opacity:.3}
.vazio-tarefas{color:var(--muted);font-size:13.5px;padding:18px 16px;text-align:center}
.recado.visivel{opacity:1;transform:translateX(-50%) translateY(0)}

/* índice de envolvidos */
.subnav{display:inline-flex;gap:2px;flex-wrap:wrap;margin:8px 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;width:max-content;max-width:100%}
.subaba{appearance:none;border:0;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 13px;border-radius:9px;font-family:inherit;transition:all .15s}
.subaba:hover{color:var(--ink)}
.subaba.ativa{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.subaba:active{transform:scale(.97)}
.linha{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:12px 16px;margin:6px 0;cursor:pointer;position:relative;transition:all .15s}
.linha:hover{border-color:var(--accent);box-shadow:var(--sombra)}
.linha-eyebrow{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:3px}
.linha-eyebrow.inline{display:inline;margin:0}
.linha-titulo{font-size:14.5px}
.linha-sub{font-size:12px;margin-top:4px}
.rapidas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;font-size:12.5px}
input.filtro{width:100%;font-size:14px;padding:9px 13px;border:1px solid var(--line-forte);border-radius:10px;background:var(--card);font-family:inherit;margin:6px 0 8px;color:var(--ink)}
input.filtro:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.lista-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lista-topo h2{margin:6px 0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.voltar{appearance:none;border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;padding:2px 0;margin-bottom:8px;font-family:inherit}
.ficha-cab{margin-bottom:12px}
.ficha-titulo{font-size:20px;margin:4px 0 14px;font-weight:700;letter-spacing:-.02em}
.ficha-acoes{display:flex;gap:8px;flex-wrap:wrap}
dl.meta{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;margin:0}
dl.meta dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
dl.meta dd{margin:0;font-size:13.5px}
.vinc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:default}
.vinc .clique{cursor:pointer}
.vinc .clique:hover strong{color:var(--accent)}
.vinc-main{flex:1}
button.x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:3px 7px;border-radius:6px}
button.x:hover{color:var(--accent);background:var(--accent-soft)}
.nuvem{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tema-btn{appearance:none;cursor:pointer;background:var(--card);border:1px solid var(--line-forte);border-radius:10px;padding:8px 14px;font-size:13.5px;font-family:inherit;color:var(--ink);box-shadow:var(--sombra);transition:all .12s}
.tema-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-abas{display:flex;gap:6px;margin-bottom:8px}
.mini-aba{appearance:none;cursor:pointer;background:var(--card);border:1px solid var(--line-forte);border-radius:999px;padding:4px 13px;font-size:12px;font-weight:600;font-family:inherit;color:var(--muted)}
.mini-aba.ativa{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sel-lista{display:grid;gap:5px;margin:8px 0;max-height:180px;overflow:auto}
.sel-item{appearance:none;cursor:pointer;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;font-family:inherit;color:var(--ink)}
.sel-item:hover{border-color:var(--accent)}
.sel-item.ativa{border-color:var(--accent);background:var(--accent-soft)}
.sel-atual{font-size:13px}


@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .base-box{align-items:flex-start}
  .base-acoes{justify-content:flex-start}
  dl.meta{grid-template-columns:1fr;gap:2px}
  dl.meta dd{margin-bottom:8px}
  header{padding:14px 16px 0}
  main,.faixa,.abas,footer{padding-left:16px;padding-right:16px}
}

/* kanban foco */
.kanban{display:flex;gap:12px;margin:14px 0;min-height:200px}
.kanban-col{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--raio);display:flex;flex-direction:column;overflow:hidden}
.kanban-cab{padding:10px 14px;font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.kanban-cab .kn{font-variant-numeric:tabular-nums;color:var(--ink)}
.kanban-cab.k-venc{color:var(--t-regra);border-bottom-color:var(--t-regra)}
.kanban-cab.k-prio{color:var(--t-atencao);border-bottom-color:var(--t-atencao)}
.kanban-cab.k-nova{color:var(--t-pratica);border-bottom-color:var(--t-pratica)}
.kanban-corpo{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kanban-corpo:empty::after{content:'Nenhum';display:block;text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:all .15s}
.kcard:hover{border-color:var(--line-forte);box-shadow:var(--sombra)}
.kcard.feito{opacity:.5}
.kcard-topo{display:flex;gap:8px;align-items:flex-start}
.kcard-info{flex:1;min-width:0}
.kcard-num{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;font-weight:600}
.kcard-classe{font-size:11px;color:var(--muted);margin-left:6px}
.kcard-titulo{font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.kcard-nota textarea{width:100%;min-height:48px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:inherit;color:var(--ink);resize:vertical;margin-top:8px}
.kcard-nota textarea:focus{border-color:var(--accent);outline:none}
.kcard-nota textarea::placeholder{color:var(--muted)}
.kcard-acoes{display:flex;gap:3px;justify-content:flex-end;margin-top:6px;opacity:0;transition:opacity .12s}
.kcard:hover .kcard-acoes{opacity:1}
.kcard[draggable="true"]{cursor:grab}
.kcard[draggable="true"]:active{cursor:grabbing}
.kcard.dragging{opacity:.3}
.kanban-corpo.drag-over{background:var(--accent-soft);border-radius:10px}
@media (max-width:768px){.kanban{flex-direction:column}}
/* foco do dia */
.foco-vazio{text-align:center;padding:40px 20px;color:var(--muted)}
.foco-item{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:16px;margin:8px 0;transition:all .15s}
.foco-item:hover{border-color:var(--line-forte)}
.foco-item.feito{opacity:.55}
.foco-topo{display:flex;gap:12px;align-items:flex-start}
.foco-ck{flex:none;margin-top:2px}
.foco-proc{flex:1;min-width:0}
.foco-num{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600}
.foco-classe{font-size:12px;color:var(--muted);margin-left:8px}
.foco-titulo{font-size:14px;margin-top:3px;color:var(--ink)}
.foco-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.foco-nota textarea{width:100%;min-height:60px;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:inherit;color:var(--ink);resize:vertical;margin-top:10px}
.foco-nota textarea:focus{border-color:var(--accent);outline:none}
.foco-nota textarea::placeholder{color:var(--muted)}
.foco-acoes{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}

/* v39: gaveta */
.g-acoes{display:flex;gap:6px;flex-wrap:wrap}
.g-acoes .btn{flex:1;min-width:120px;justify-content:center}
.btn.marcado{border-color:var(--t-pratica);color:var(--t-pratica);background:var(--t-pratica-bg)}
.g-dica{font-size:13px}
.g-vinc{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px}
.g-vinc + .g-vinc{border-top:1px solid var(--line)}
.g-vinc .ck{width:17px;height:17px}
.g-vinc-tx{flex:1;min-width:0;cursor:pointer}
.g-vinc-tx:hover{color:var(--accent)}
.g-vinc-tx.feito,.g-vinc.dispensado .g-vinc-tx{color:var(--muted);text-decoration:line-through}
.g-link{cursor:pointer;color:var(--accent)}
.env-linha{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.env-linha:hover{background:var(--card)}
.env-linha:hover .env-nome{color:var(--accent)}
.env-tipo{font-size:11.5px}
.g-regs{display:grid;gap:5px}
.g-reg{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
.gaveta .bloco-g > .btn.sm{justify-self:start}

/* v39: eixos temáticos como etiquetas */
.temas-ed{display:grid;gap:6px}
.temas-chips{display:flex;gap:6px;flex-wrap:wrap}
.tema-chip{display:inline-flex;align-items:center;gap:4px;background:var(--t-ferramenta-bg);color:var(--t-ferramenta);border-radius:6px;padding:2px 4px 2px 9px;font-size:12.5px;font-weight:600}
.tema-x{appearance:none;border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px;border-radius:4px;opacity:.7}
.tema-x:hover{opacity:1;background:var(--card)}

/* v39: controle */
.metricas.fechada{padding:0;background:transparent;border:0;margin:0 0 8px}
.metricas-cab{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;gap:8px;align-items:center;padding:4px 2px}
.metricas:not(.fechada) .metricas-cab{margin-bottom:10px}
.metricas-resumo{font-weight:400;font-size:12.5px}
.filtro-chip.limpar{border-style:dashed}
.idx-badge{font-size:10.5px;color:var(--muted);border:1px dashed var(--line-forte);border-radius:5px;padding:0 6px;line-height:1.6}
.c-filtros select.oculto{display:none}

/* v39: feitos hoje */
.feitos-hist{margin-top:26px}
.hist-linha{border-radius:8px;padding:4px 6px;margin:0 -6px}
.hist-linha.clicavel{cursor:pointer}
.hist-linha.clicavel:hover{background:var(--card)}
.hist-data{width:auto;min-width:78px}
.hist-procs{margin:2px 0 10px 88px;display:grid;gap:4px}
.hist-proc{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.hist-proc:hover{border-color:var(--accent)}
.hist-proc-tit{flex:1;min-width:200px}
.hist-proc-nota{flex-basis:100%;font-size:12.5px;color:var(--muted);white-space:pre-wrap}

/* v39: foco do dia */
.foco-progresso{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.foco-barra{flex:0 1 240px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.foco-barra > div{height:100%;background:var(--t-pratica);border-radius:99px;transition:width .3s}
.kcard{cursor:grab}
.kcard.leitura{cursor:default;padding:8px 12px}
.kcard textarea,.kcard select,.kcard button{cursor:auto}
.kcard-titulo{font-size:13px}
.kcard-marca{flex:none;width:17px;text-align:center;color:var(--muted);font-weight:700}
.kcard-marca.on{color:var(--t-pratica)}
.kcard-hist-nota{margin-top:5px;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.kcard-acoes{align-items:center}
.kcard-mover{font-size:11.5px;padding:2px 6px;border:1px solid var(--line-forte);border-radius:6px;background:var(--card);color:var(--ink);font-family:inherit}
.sel-grupo{font-size:11.5px;color:var(--muted);padding:2px 2px 4px}
@media (hover: none){.kcard-acoes,.t-acoes{opacity:1}}


/* v39: ajustes vistos nos prints */
.base-box{margin-left:auto}
.base-info{cursor:default}
.metricas.fechada{box-shadow:none}
.g-acoes .btn{white-space:nowrap;min-width:0;padding-left:10px;padding-right:10px}
.env-linha{padding:4px 8px;font-size:13px;line-height:1.35}
.env-linha .chip.papel{flex:none}
.g-env-pe{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.t-qadd input[type=date]{flex:0 0 165px;width:165px}
.hist-linha{margin:0;padding:3px 0}
.hist-linha.clicavel:hover{background:transparent}
.hist-linha.clicavel:hover .hist-data,.hist-linha.clicavel:hover .hist-n{color:var(--accent)}
.hist-procs{margin-left:84px}
@media (max-width: 720px){ .base-box{margin-left:0} .hist-procs{margin-left:0} }


/* v40: aviso flutuante (a regra base tinha se perdido: o aviso ia para o pé da página) */
.recado{position:fixed;left:50%;bottom:24px;z-index:70;transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:min(620px,92vw);padding:11px 16px;border-radius:12px;
  background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.4;box-shadow:var(--sombra-alta);transition:opacity .18s,transform .18s}
.recado.visivel{pointer-events:auto}
.recado-txt{flex:1;min-width:0}
.recado-acao{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 4px;border-radius:6px;flex:none}
.recado-acao:hover{background:rgba(127,127,127,.25)}
@media (max-width: 720px){.recado{bottom:84px}}
/* v40: gaveta fechada some de verdade (sem foco pelo Tab e sem depender de animação) */
.gaveta{visibility:hidden;transition:transform .22s cubic-bezier(.22,.68,.36,1),visibility 0s linear .22s}
.gaveta.aberta{visibility:visible;transition:transform .22s cubic-bezier(.22,.68,.36,1),visibility 0s}


/* v40: conferência da colagem de procedimentos */
.conf-bloco{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--paper)}
.conf-bloco .sec-h{margin:0 0 6px}
.conf-bloco.alerta{border-color:var(--aviso-borda);background:var(--aviso-bg)}
.conf-linha{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:2px 0;flex-wrap:wrap}


/* v40: acessibilidade e detalhes */
.proc-card:focus-visible,.linha:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.r-tar .ck{flex:none;margin-top:1px}
.kcard-nota textarea{resize:vertical;max-height:260px}


/* v41: mudanças nos dois computadores */
.conf-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--paper);display:grid;gap:6px;justify-items:start}
.conf-tit{font-weight:600;font-size:13.5px}
.conf-par{display:grid;grid-template-columns:128px 1fr;gap:8px;font-size:13px;width:100%}
.conf-lado{color:var(--muted);font-size:12px;padding-top:1px}
.conf-val{white-space:pre-wrap;word-break:break-word;font-size:13px}


/* v42: Google Drive */
.passos{margin:4px 0 0 18px;padding:0;display:grid;gap:4px}

/* polimento */
*{scrollbar-width:thin;scrollbar-color:var(--line-forte) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-forte);border-radius:99px;border:2px solid var(--card)}
::-webkit-scrollbar-track{background:transparent}
.mono,.due,.proc-num,.chart-n{font-variant-numeric:tabular-nums}
.btn:active,.filtro-chip:active,.stat-chip:active{transform:scale(.97)}
.proc-card:hover{transform:translateY(-1px)}
.linha:hover{transform:translateY(-1px)}
.logo{width:27px;height:27px;border-radius:8px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-size:15px;font-weight:800;flex:none;letter-spacing:0}
.gaveta[data-faixa="venc"] .g-cab{box-shadow:inset 0 3px 0 var(--t-regra)}
.gaveta[data-faixa="prox"] .g-cab{box-shadow:inset 0 3px 0 var(--t-atencao)}
.gaveta[data-faixa="folg"] .g-cab{box-shadow:inset 0 3px 0 var(--t-pratica)}
.hist-linha{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.hist-data{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:var(--muted);width:46px;flex:none;font-variant-numeric:tabular-nums}
.hist-bar{height:8px;border-radius:99px;background:var(--accent);opacity:.85;min-width:2px}
.hist-bar.zero{background:var(--line);opacity:1}
.hist-n{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
footer{font-size:11.5px;opacity:.8}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.r-orient{background:var(--t-promotora-bg);border:1px solid var(--line);border-radius:var(--raio);padding:12px 16px;margin:8px 0 16px}
.r-orient .seclab{margin-top:0}
.r-orient .oitem{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.r-orient .oitem + .oitem{border-top:1px solid var(--line)}
.r-orient .oitem .otx{flex:1}
.r-orient .oitem .ometa{color:var(--muted);font-size:11.5px;white-space:nowrap}
.r-card{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);padding:14px 18px;margin:10px 0;box-shadow:var(--sombra)}
.r-card .r-head{display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap}
.r-card .r-head h3{margin:0;font-size:16px;flex:1;min-width:200px}
.r-card .r-head .r-sub{color:var(--muted);font-size:12.5px}
.r-sec{margin:14px 0 4px}
.r-exp{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--paper)}
.r-exp .r-num{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.r-exp .r-lbl{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.r-exp p{margin:2px 0;font-size:14px}
.r-item{padding:5px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.r-item + .r-item{border-top:1px solid var(--line)}
.r-item .rk{color:var(--muted);flex:none}
.r-item.done{color:var(--muted);text-decoration:line-through}
.r-tar{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.r-tar .ckm{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-forte);margin-top:3px}
.r-tar .ckm.on{background:var(--t-pratica);border-color:var(--t-pratica)}
.r-tar.done{color:var(--muted);text-decoration:line-through}
.r-hit{background:var(--aviso-bg);border-radius:4px;padding:0 2px}

/* v43: Controle redesenhado */
.abas-inner{overflow-x:auto;max-width:100%;scrollbar-width:none}
.abas-inner::-webkit-scrollbar{display:none}
.aba{flex:none}
.c-topo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px}
.c-topo-dir{display:flex;gap:6px;align-items:center}
.c-topo-dir .menu-wrap > .btn{min-width:36px;font-size:15px;line-height:1;padding:5px 10px}
.seg{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 13px;border-radius:8px;display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap;flex:none;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--card)}
.seg .n{font-size:11.5px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.c-ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c-busca-wrap{flex:1 1 300px;position:relative;min-width:0}
.c-busca{width:100%;font:inherit;font-size:14px;padding:9px 12px 9px 36px;border:1px solid var(--line-forte);border-radius:11px;background:var(--card);color:var(--ink);transition:border-color .12s,box-shadow .12s}
.c-busca:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.c-busca::placeholder{color:var(--muted)}
.c-lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;display:flex}
.c-lupa svg{width:16px;height:16px}
.c-sel{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line-forte);border-radius:10px;background:var(--card);color:var(--ink);max-width:250px;cursor:pointer}
.c-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.c-sel.ativo{border-color:var(--accent);color:var(--accent);font-weight:600}
.c-btfiltros{display:inline-flex;gap:6px;align-items:center;padding:8px 13px;font-size:13px}
.c-btfiltros.ativo{border-color:var(--accent);color:var(--accent)}
.c-nfiltros:not(:empty){background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 5px}
.c-faixas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.c-faixa{appearance:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap;transition:border-color .12s,background .12s}
.c-faixa:hover{border-color:var(--line-forte)}
.c-faixa .n{font-variant-numeric:tabular-nums;font-weight:700}
.c-faixa.venc .n{color:var(--t-regra)}
.c-faixa.sete .n{color:var(--t-atencao)}
.c-faixa.trinta .n{color:var(--t-modelo)}
.c-faixa.folg .n{color:var(--t-pratica)}
.c-faixa.sem .n,.c-faixa.concl .n{color:var(--muted)}
.c-faixa.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.c-faixa.on .n{color:inherit}
.c-resumo{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.c-link{appearance:none;border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-forte);text-underline-offset:3px}
.c-link:hover{color:var(--accent);text-decoration-color:currentColor}
.c-ativos{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.c-ativo{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 3px 2px 10px;font-size:12.5px;font-weight:600;max-width:100%}
.c-ativo button{appearance:none;border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:1px 6px;border-radius:6px}
.c-ativo button:hover{background:var(--card)}
.c-limpar{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
.c-limpar:hover{color:var(--accent)}
.c-lista{margin-top:6px}
.c-grupo{appearance:none;border:0;background:transparent;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:18px 2px 8px;text-align:left}
.c-grupo:hover{color:var(--ink)}
.c-grupo-n{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.c-grupo .srule{flex:1;height:1px;background:var(--line)}
.c-grupo.g-venc,.c-grupo.g-venc .c-grupo-n{color:var(--t-regra)}
.c-grupo.g-sete,.c-grupo.g-sete .c-grupo-n{color:var(--t-atencao)}
.c-grupo .seta-dobra{color:inherit}
.c-painel{background:var(--card);border:1px solid var(--line);border-radius:var(--raio);overflow:hidden}
.c-painel:first-child{margin-top:14px}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) 196px 112px 64px;gap:14px;align-items:center;padding:9px 12px 9px 16px;cursor:pointer;position:relative;transition:background .1s}
.c-row + .c-row{border-top:1px solid var(--line)}
.c-row:hover{background:var(--paper)}
.c-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0}
.c-row.atual{background:var(--accent-soft)}
.c-row.atual::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.c-row.arquivado{opacity:.55}
.c-main{min-width:0}
.c-tit{font-size:14px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.c-l2{display:flex;gap:4px 10px;align-items:baseline;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;min-width:0;line-height:1.4}
.c-l2 > span{flex:none}
.c-l2 > .c-acao,.c-l2 > .c-ev,.c-l2 > .c-motivo{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-num{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.c-pj{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:11px}
.c-acao{color:var(--ink);opacity:.85}
.c-motivo{color:var(--accent);font-weight:600}
.c-badge{font-size:11px}
mark.c-hit{background:var(--aviso-bg);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--aviso-borda)}
.c-sit{appearance:none;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;justify-self:start;max-width:100%;min-width:0;color:var(--ink);text-align:left}
.c-sit-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-sit:hover{background:var(--chip)}
.c-sit.vazia{color:var(--muted);font-weight:500;opacity:0}
.c-row:hover .c-sit.vazia,.c-row:focus-within .c-sit.vazia,.c-row.atual .c-sit.vazia{opacity:1}
.c-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--line-forte)}
.d-sem_triagem{background:var(--line-forte)}
.d-analise{background:var(--t-ferramenta)}
.d-aguardando{background:var(--t-atencao)}
.d-minutar{background:var(--t-regra)}
.d-promotora{background:var(--t-promotora)}
.d-concluido{background:var(--t-pratica)}
.c-prazo{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;text-align:right;min-width:0}
.c-rel{font-size:12.5px;font-weight:600;white-space:nowrap}
.c-data{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.c-prazo.venc .c-rel{color:var(--t-regra)}
.c-prazo.sete .c-rel{color:var(--t-atencao)}
.c-prazo.trinta .c-rel{color:var(--t-modelo)}
.c-prazo.folg .c-rel{color:var(--t-pratica)}
.c-prazo.concl .c-rel{color:var(--muted);font-weight:500}
.c-acoes{display:flex;gap:4px;justify-content:flex-end}
.c-ic{appearance:none;border:0;background:transparent;width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;display:inline-grid;place-items:center;opacity:0;transition:opacity .1s,background .1s,color .1s;font-family:inherit}
.c-row:hover .c-ic,.c-row:focus-within .c-ic,.c-row.atual .c-ic,.c-ic.on,.c-ic:focus-visible{opacity:1}
.c-ic:hover{background:var(--chip);color:var(--ink)}
.c-ic.on{color:var(--t-pratica);background:var(--t-pratica-bg)}
.c-ic.foco.on{color:var(--accent);background:var(--accent-soft)}
.c-vazio{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.c-vazio p{margin:0}
@media (hover:none){.c-ic,.c-sit.vazia{opacity:1}}

/* janelinhas (situação, filtros) */
.pop{position:fixed;z-index:80;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sombra-alta);padding:6px}
.pop-menu{min-width:230px}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;appearance:none;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop-item:hover,.pop-item:focus-visible{background:var(--paper);outline:none}
.pop-item.atual{font-weight:700}
.pop-item.atual::after{content:'✓';margin-left:auto;color:var(--accent);font-weight:700}
.pop-filtros{width:min(340px,calc(100vw - 16px));padding:14px}
.pf-corpo{display:grid;gap:12px}
.c-marca{display:flex;gap:9px;align-items:center;font-size:13.5px;cursor:pointer}
.c-marca input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}

/* gaveta */
.gaveta{width:min(520px,100vw)}
.g-cab{display:block;padding:14px 18px 12px}
.g-cab-l1{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.g-cab-l1 .linha-eyebrow{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-nav{display:flex;align-items:center;gap:2px;flex:none}
.g-nav .btn-mini{font-size:18px;width:30px;height:30px;padding:0;display:inline-grid;place-items:center}
.g-nav .btn-mini:disabled{opacity:.3;cursor:default;background:transparent;color:var(--muted)}
.g-nav.sem-lista #g-ant,.g-nav.sem-lista #g-prox,.g-nav.sem-lista .g-pos{display:none}
.g-pos{font-size:11.5px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.g-titulo{font-size:16.5px;font-weight:650;line-height:1.35;margin:4px 0 6px;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.g-ids{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:13px}
.g-numero{font-size:13.5px;font-weight:700}
.g-pj{font-size:12.5px;color:var(--muted)}
.g-copiar{appearance:none;border:1px solid var(--line-forte);background:transparent;border-radius:6px;font:inherit;font-size:11px;font-weight:600;padding:1px 7px;color:var(--muted);cursor:pointer;line-height:1.5}
.g-copiar:hover{color:var(--accent);border-color:var(--accent)}
.g-aviso{font-size:11.5px;margin-top:4px}
.g-aviso:empty{display:none}
.g-corpo{display:block;padding:0 18px 22px}
.g-sec{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:12px}
.g-sec:first-child{border-top:0;padding-top:14px}
.g-sec > h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:baseline}
.g-h3-dica{font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500}
.g-fatos{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;font-size:13.5px;margin:0;align-items:baseline}
.g-fatos dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.g-fatos dd{margin:0;min-width:0;overflow-wrap:anywhere}
.g-ev-tx{color:var(--muted);font-size:12.5px}
.g-rel{font-weight:600}
.g-rel.venc{color:var(--t-regra)}
.g-rel.sete{color:var(--t-atencao)}
.g-rel.trinta{color:var(--t-modelo)}
.g-rel.folg{color:var(--t-pratica)}
.g-sits{display:flex;flex-wrap:wrap;gap:6px}
.g-sit{appearance:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line-forte);border-radius:999px;padding:5px 12px 5px 10px;display:inline-flex;gap:7px;align-items:center;transition:all .12s}
.g-sit:hover{color:var(--ink);border-color:var(--muted)}
.g-sit.on{border-color:currentColor}
.g-sit.on.s-sem_triagem{color:var(--ink);background:var(--paper)}
.g-sit.on.s-analise{color:var(--t-ferramenta);background:var(--t-ferramenta-bg)}
.g-sit.on.s-aguardando{color:var(--t-atencao);background:var(--t-atencao-bg)}
.g-sit.on.s-minutar{color:var(--t-regra);background:var(--t-regra-bg)}
.g-sit.on.s-promotora{color:var(--t-promotora);background:var(--t-promotora-bg)}
.g-sit.on.s-concluido{color:var(--t-pratica);background:var(--t-pratica-bg)}
.g-prazo-int{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g-prazo-int input[type=date]{width:auto;flex:0 0 170px}
.g-atalhos{display:flex;gap:5px;flex-wrap:wrap}
.mini-chip{appearance:none;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap}
.mini-chip:hover{color:var(--accent);border-color:var(--accent)}
.g-hist{display:grid;gap:7px}
.g-hist-it{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:13px;align-items:baseline;line-height:1.45}
.g-hist-q{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-hist-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-right:4px}
.g-hist-tag.trab{color:var(--t-pratica)}
.g-env{display:grid}
.g-det{border-top:1px solid var(--line);padding:16px 0 0}
.g-det > summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;list-style:none;display:flex;gap:10px;align-items:baseline}

<script>
'use strict';

/* ---------- estado ---------- */
let db = null;
let fileHandle = null;
let dirty = false;

let ultimoSalvo = '';
let ultimaExterna = '';   // quando a base foi atualizada pela versão salva em outro computador
let ultimaJuncao = null;  // resultado da última junção feita ao salvar
const FS_OK = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
const S = { aba: 'controle' };
const dobradas = new Set();
const diasAbertosFeitos = new Set();
let ultimaBaseHandle = null;
const filtrosProc = { busca: '', classe: '', situacao: '', prazo: '', assunto: '', tema: '', arquivados: false, semIndice: false, tipo: '', indice: '' };
let ordemProc = { campo: 'prazoEfetivo', asc: true };
let gavetaId = null;
const ST = { subaba: 'tarefas', filtroTarefa: 'pendentes', busca: '', agrupar: 'prazo' };
const recemConcluidas = new Set();
const IX = { view: 'busca', q: '', fichaId: null, tema: null, filtro: { pessoas: '', entidades: '', expedientes: '' }, ordem: {} };
const pilhaIx = [];

/* ---------- utilitários ---------- */
const $ = (sel) => document.querySelector(sel);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'value') n.value = v;
      else n.setAttribute(k, v);
    }

  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false || kid === '') continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = (s) => (s === null || s === undefined ? '' : String(s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const splitLista = (s) => (s || '').split(',').map((x) => x.trim()).filter(Boolean);
const sTrim = (v) => (v === null || v === undefined ? '' : String(v).trim());
const aLista = (v) => (Array.isArray(v) ? v.map(sTrim).filter(Boolean) : splitLista(sTrim(v)));
function fmtDataHora(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function carimboData() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

/* ---------- base e persistência ---------- */
function novaBaseVazia() {
  const t = new Date().toISOString();
  return { meta: { app: 'guia-extrajudicial', versao: 4, criadoEm: t, atualizadoEm: t }, etapas: [], itens: [], procedimentos: [], pessoas: [], entidades: [], expedientes: [], vinculos: [], tarefas: [], lembretes: [], focoDia: [], reunioes: [], orientacoes: [] };
}
function validarBase(d) {
  if (!d || typeof d !== 'object') throw new Error('o arquivo não contém uma base válida.');
  if (Array.isArray(d.fases) && !Array.isArray(d.etapas)) {
    d.etapas = d.fases;
    delete d.fases;
    for (const i of (d.itens || [])) { if (i.faseId && !i.etapaId) { i.etapaId = i.faseId; delete i.faseId; } }
  }
  const eBaseIndice = Array.isArray(d.pessoas) && Array.isArray(d.vinculos) && !Array.isArray(d.etapas) && !Array.isArray(d.procedimentos);
  const eBaseControle = Array.isArray(d.procedimentos) && !Array.isArray(d.etapas);
  if (eBaseIndice || eBaseControle) { d.etapas = d.etapas || []; d.itens = d.itens || []; }
  for (const k of ['etapas', 'itens']) {
    if (!Array.isArray(d[k])) throw new Error('o arquivo não tem o campo "' + k + '" no formato esperado.');
  }
  if (!Array.isArray(d.procedimentos)) d.procedimentos = [];
  d.procedimentos = d.procedimentos.map(normalizarProc);
  for (const k of ['pessoas', 'entidades', 'expedientes', 'vinculos', 'tarefas', 'lembretes', 'focoDia', 'reunioes', 'orientacoes']) {
    if (!Array.isArray(d[k])) d[k] = [];
  }
  d.tarefas = d.tarefas.map(normTarefa);
  d.lembretes = d.lembretes.map(normLembrete);
  d.focoDia = d.focoDia.map(normFoco);
  if (!d.meta || typeof d.meta !== 'object') {
    d.meta = { app: 'guia-extrajudicial', versao: 4, criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString() };
  }
  return d;
}
function touch() {
  if (!db) return;
  db.meta.atualizadoEm = new Date().toISOString();
  dirty = true;
  contadorTouch++;
  atualizarCabecalho();
  montarBotaoSalvar();
}
async function salvarAgora() { return comArquivo(gravarNoArquivo); }
async function gravarNoArquivo() {
  if (!db || !fileHandle) return false;
  let ok = false;
  ultimaJuncao = null;
  try {
    let ext = null;
    try { ext = await lerArquivoSeMudou(); }
    catch (e) {
      if (!(e && e.name === 'NotFoundError') && !confirm('Não consegui conferir se o arquivo foi salvo em outro computador (' + ((e && e.message) || 'erro desconhecido') + '). Salvar por cima mesmo assim?')) return false;
    }
    if (ext) {
      let outra = null;
      try { outra = validarBase(JSON.parse(ext.texto)); } catch (e) { outra = null; }
      if (outra) {
        const textoOutra = JSON.stringify(outra);
        const r = juntarVersoes(JSON.parse(baseComum), db, outra);
        db = r.base;
        baseComum = textoOutra;
        discoTexto = ext.texto; discoMod = ext.mod; discoTam = ext.tam;
        ultimaJuncao = { r: r, quando: quandoFoi(ext.mod) };
      } else if (!confirm('O arquivo da base mudou fora deste app e não está legível agora (pode estar no meio da sincronização). Salvar por cima mesmo assim?')) {
        return false;
      }
    }
    const texto = JSON.stringify(db, null, 2);
    const w = await fileHandle.createWritable();
    await w.write(texto);
    await w.close();
    let mod = Date.now(), tam = -1;
    try { const f2 = await fileHandle.getFile(); mod = f2.lastModified; tam = f2.size; } catch (e) { /* sem leitura agora: a próxima conferência compara pelo conteúdo */ }
    registrarDisco(texto, mod, tam);
    dirty = false;
    ok = true;
    ultimoSalvo = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    ultimaExterna = '';
  } catch (e) {
    alert('Falha ao gravar no arquivo da base: ' + e.message + '\nUse "Exportar backup" no menu Mais para não perder as alterações.');
  }
  if (ultimaJuncao) { desfazerAtual = null; redesenharMantendo(); }
  montarBotaoSalvar();
  atualizarCabecalho();
  return ok;
}
async function salvarTudo() {
  if (!db) return;
  const pedidoGoogle = emDrive() && !tokenValido() ? garantirTokenGoogle(true) : null;   // ainda dentro do clique
  aplicarGaveta();
  if (pedidoGoogle && !(await pedidoGoogle)) {
    recado('Sem conexão com o Google: as alterações continuam aqui. Tente salvar de novo e entre na janelinha do Google.');
    return;
  }
  if (!dirty) {
    if (fileHandle) { await verificarArquivo(true); return; }
    recado('Nada novo para salvar.');
    return;
  }
  if (fileHandle) {
    if (await salvarAgora()) {
      if (ultimaJuncao) avisarJuncao(ultimaJuncao.r, ultimaJuncao.quando, true, false);
      else recado('Base salva às ' + ultimoSalvo + '.');
    }
  } else {
    exportarBackup();
    recado('Base exportada. Sem arquivo aberto, cada salvamento baixa uma cópia.');
  }
}
function podeTrocarBase() {
  aplicarGaveta();
  if (!db || !dirty) return true;
  return confirm('Há alterações não salvas nesta base. Se continuar, elas serão perdidas. Continuar mesmo assim?');
}
async function abrirBase() {
  if (!podeTrocarBase()) return;
  try {
    const sel = await window.showOpenFilePicker({ types: [{ description: 'Base do guia (.json)', accept: { 'application/json': ['.json'] } }] });
    const h = sel[0];
    const f = await h.getFile();
    const txt = await f.text();
    db = validarBase(JSON.parse(txt));
    fileHandle = h; dirty = false; ultimoSalvo = ''; ultimaExterna = '';
    registrarDisco(txt, f.lastModified, f.size);
    lembrarBase(h);
    resetarNavegacao();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (e && e.name === 'SecurityError') { alert('Este ambiente não permite abrir arquivos diretamente. Baixe o app e abra no Edge ou no Chrome.'); return; }
    alert('Não foi possível abrir a base: ' + e.message);
  }
}
/* lembra a última base aberta (IndexedDB) para reabrir com um clique */
function guardaIdb(op, valor) {
  return new Promise((res) => {
    if (typeof indexedDB === 'undefined') { res(null); return; }
    try {
      const rq = indexedDB.open('guia-extrajudicial', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onerror = () => res(null);
      rq.onsuccess = () => {
        try {
          const tx = rq.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite');
          const st = tx.objectStore('kv');
          const r2 = op === 'get' ? st.get('ultimaBase') : st.put(valor, 'ultimaBase');
          r2.onsuccess = () => res(op === 'get' ? (r2.result || null) : true);
          r2.onerror = () => res(null);
        } catch (e) { res(null); }
      };
    } catch (e) { res(null); }
  });
}
function lembrarBase(h) { ultimaBaseHandle = h; guardaIdb('put', h); }
async function reabrirUltimaBase() {
  const h = ultimaBaseHandle;
  if (!h) { abrirBase(); return; }
  try {
    let perm = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (perm !== 'granted' && h.requestPermission) perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { alert('Sem permissão para editar ' + h.name + '. Use "Abrir base existente" e escolha o arquivo.'); return; }
    const f = await h.getFile();
    const txt = await f.text();
    db = validarBase(JSON.parse(txt));
    fileHandle = h; dirty = false; ultimoSalvo = ''; ultimaExterna = '';
    registrarDisco(txt, f.lastModified, f.size);
    resetarNavegacao();
  } catch (e) {
    alert('Não consegui reabrir ' + (h.name || 'a última base') + ' (' + e.message + '). Use "Abrir base existente".');
  }
}
/* ---------- mais de um computador: o arquivo numa pasta sincronizada ---------- */
let discoTexto = '';   // texto do arquivo na última leitura ou gravação feita aqui
let discoMod = 0;      // data de modificação do arquivo nesse momento
let discoTam = -1;     // tamanho do arquivo nesse momento
let baseComum = '';    // última versão que este computador e o arquivo tinham em comum
let avisoArquivo = '';
let filaArquivo = Promise.resolve();
/* leituras e gravações do arquivo, uma de cada vez */
function comArquivo(fn) {
  const p = filaArquivo.then(() => fn());
  filaArquivo = p.then(() => undefined, () => undefined);
  return p;
}
function registrarDisco(texto, mod, tam) {
  discoTexto = texto;
  discoMod = mod || 0;
  discoTam = typeof tam === 'number' ? tam : -1;
  baseComum = db ? JSON.stringify(db) : '';
  avisoArquivo = '';
}
function esquecerDisco() { discoTexto = ''; discoMod = 0; discoTam = -1; baseComum = ''; avisoArquivo = ''; }
/* devolve o conteúdo do arquivo se ele mudou fora deste app; se não mudou, null */
async function lerArquivoSeMudou() {
  if (!fileHandle || !baseComum) return null;
  const f = await fileHandle.getFile();
  avisoArquivo = '';
  if (f.lastModified === discoMod && f.size === discoTam) return null;
  const texto = await f.text();
  if (texto === discoTexto) { discoMod = f.lastModified; discoTam = f.size; return null; }
  return { texto: texto, mod: f.lastModified, tam: f.size };
}
function quandoFoi(ms) {
  const d = new Date(ms);
  if (isNaN(d.getTime())) return '';
  const h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === new Date().toDateString()) return 'às ' + h;
  return 'em ' + d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + h;
}
function editandoTexto() {
  const a = document.activeElement;
  if (!a || a === document.body) return false;
  const dlg = a.closest ? a.closest('dialog') : null;
  if (dlg && !dlg.hasAttribute('open')) return false;
  const gav = a.closest ? a.closest('#gaveta') : null;
  if (gav && !gav.classList.contains('aberta')) return false;
  if (a.tagName === 'TEXTAREA' || a.isContentEditable) return true;
  if (a.tagName === 'INPUT') return !/^(search|checkbox|radio|button|submit|reset|range|color|file)$/.test(a.type || 'text');
  return false;
}
/* não troca a base por baixo de quem está escrevendo: espera o diálogo fechar, o campo perder o foco, a gaveta ser concluída */
function adiarVerificacao() { return !!document.querySelector('dialog[open]') || editandoTexto() || gavetaTemEdicao() || !!popAtual; }
function verificarArquivo(manual) {
  if (!db || !fileHandle || !baseComum) return Promise.resolve();
  if (!manual && (document.hidden || adiarVerificacao())) return Promise.resolve();
  return comArquivo(() => verificarAgora(manual));
}
async function verificarAgora(manual) {
  if (!db || !fileHandle || !baseComum) return;
  const h = fileHandle;
  let ext;
  try { ext = await lerArquivoSeMudou(); }
  catch (e) { if (fileHandle === h) avisarProblemaArquivo(e, manual); return; }
  if (fileHandle !== h) return;
  if (!ext) { if (manual) recado('Nada novo: está tudo salvo e igual ao arquivo.'); return; }
  let outra;
  try { outra = validarBase(JSON.parse(ext.texto)); }
  catch (e) { if (manual) recado('O arquivo mudou, mas ainda não dá para ler (talvez esteja sincronizando). O app tenta de novo sozinho.'); return; }
  if (!manual && adiarVerificacao()) return;
  receberVersaoExterna(outra, ext);
}
function avisarProblemaArquivo(e, manual) {
  const tipo = (e && e.name) || 'erro';
  if (!manual && avisoArquivo === tipo) return;
  avisoArquivo = tipo;
  if (tipo === 'TokenExpirado') {
    precisaReconectar = true;
    montarAcoesBase(); atualizarCabecalho();
    recado('A conexão com o Google dura cerca de uma hora. Clique em "Reconectar", no topo, para voltar a receber o que o outro computador salvar.');
    return;
  }
  if (tipo === 'SemConexao') { recado('Sem conexão com o Google Drive agora. O app tenta de novo sozinho.'); return; }
  if (tipo === 'NotFoundError' && emDrive()) { recado('O arquivo da base não está mais no seu Google Drive (apagado ou na lixeira?). O que está na tela continua aqui: use Exportar backup ou Enviar para o Google Drive.'); return; }
  if (tipo === 'SemPermissaoDrive' || tipo === 'ErroDrive') { recado('O Google Drive respondeu com erro: ' + e.message + '.'); return; }
  if (tipo === 'NotFoundError') recado('Não encontrei mais o arquivo da base no lugar de antes (movido, renomeado ou apagado?). O que está na tela continua aqui; se você o moveu, abra de novo pelo lugar novo.');
  else if (tipo === 'NotAllowedError') recado('O navegador tirou a permissão de ler o arquivo da base. Use "Abrir base existente" e escolha o arquivo de novo.');
  else recado('Não consegui ler o arquivo da base agora (' + ((e && e.message) || tipo) + ').');
}
function receberVersaoExterna(outra, ext) {
  const quando = quandoFoi(ext.mod);
  aplicarGaveta();
  desfazerAtual = null;
  if (!dirty) {
    db = outra;
    registrarDisco(ext.texto, ext.mod, ext.tam);
    ultimoSalvo = '';
    ultimaExterna = quando;
    const fechou = redesenharMantendo();
    recado('Base atualizada com a versão salva em outro computador ' + quando + '.' + (fechou ? ' O procedimento que estava aberto foi excluído lá.' : ''));
    return;
  }
  const textoOutra = JSON.stringify(outra);
  const r = juntarVersoes(JSON.parse(baseComum), db, outra);
  db = r.base;
  baseComum = textoOutra;
  discoTexto = ext.texto; discoMod = ext.mod; discoTam = ext.tam;
  dirty = estavel(db) !== estavel(outra);
  const fechou = redesenharMantendo();
  avisarJuncao(r, quando, false, fechou);
}
/* redesenha com a base nova sem tirar a pessoa de onde estava */
function redesenharMantendo() {
  const y = window.scrollY || 0;
  const ativo = document.activeElement;
  const buscaFocada = !!(ativo && ativo.matches && ativo.matches('#main input[type=search]'));
  const gid = gavetaId;

function handleDrive(meta) {

      const m = await metaDrive(h.id);

      if (m.name) h.name = m.name;
      return {
        lastModified: Date.parse(m.modifiedTime) || 0,
        size: Number(m.size) || 0,
        text: async () => (await chamarDrive(API_DRIVE + '/' + encodeURIComponent(h.id) + '?alt=media')).text()
      };
    },
    async createWritable() {
      let buf = '';

        write: async (x) => { buf += x; },
        close: async () => { await chamarDrive(UPLOAD_DRIVE + '/' + encodeURIComponent(h.id) + '?uploadType=media&fields=' + CAMPOS_DRIVE, { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: buf }); }

async function criarArquivoDrive(texto) {

  const meta = { name: NOME_ARQUIVO_DRIVE, mimeType: 'application/json', appProperties: { [MARCA_BASE]: 'base' } };
  const corpo = '--' + limite + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
    '\r\n--' + limite + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + texto + '\r\n--' + limite + '--';
  const r = await chamarDrive(UPLOAD_DRIVE + '?uploadType=multipart&fields=' + CAMPOS_DRIVE, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + limite }, body: corpo });

  const aberta = metricasAbertas();
  const alternar = () => { try { localStorage.setItem('metricasAbertas', aberta ? '0' : '1'); } catch (e) { /* sem armazenamento local */ } aoAlternar(); };
  const hjN = db.procedimentos.filter((pr) => feitoHoje(pr)).length;
  const cab = el('button', { class: 'metricas-cab', 'aria-expanded': String(aberta), onclick: alternar },
    el('span', { class: 'seta-dobra' }, aberta ? '▾' : '▸'), 'Produtividade', el('span', { class: 'muted metricas-resumo' }, hjN + ' feito(s) hoje'));
  if (!aberta) return el('div', { class: 'metricas fechada' }, cab);
  const c = el('div', { class: 'metricas' }, cab);
  const hj = hojeStr();
  const dias = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const p = (n) => String(n).padStart(2, '0');
    const ds = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const contagem = db.procedimentos.filter((pr) => (pr.registro || []).some((r) => r.data === ds)).length;
    dias.push({ ds: ds, dia: p(d.getDate()) + '/' + p(d.getMonth() + 1), dow: d.getDay(), n: contagem, hoje: ds === hj });
  }

  const semana = dias.filter((d) => {
    const dt = new Date(d.ds + 'T12:00:00');
    const hjDt = new Date(hj + 'T12:00:00');
    const diff = (hjDt - dt) / 86400000;
    return diff >= 0 && diff < 7;

  const totalHoje = dias.find((d) => d.hoje);
  const diasUteis = semana.filter((d) => d.dow > 0 && d.dow < 6).length;
  const mediaSemana = diasUteis ? (totalSemana / diasUteis).toFixed(1).replace('.', ',') : '0';
  const chart = el('div', { class: 'chart-dias' });
  for (const d of dias) {
    const pct = Math.round((d.n / max) * 100);

      el('span', { class: 'chart-d' }, d.dia)
    );
    chart.append(col);
  }
  c.append(chart);
  c.append(el('div', { class: 'chart-total' },
    el('span', {}, 'Hoje: ', el('strong', {}, String(totalHoje ? totalHoje.n : 0))),
    el('span', {}, 'Semana: ', el('strong', {}, String(totalSemana))),
    el('span', {}, 'Média por dia útil: ', el('strong', {}, mediaSemana)),
    el('span', { class: 'muted' }, 'últimos 14 dias')

}

function paraData(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function paraBR(v) {
  const d = paraData(v);
  if (!d) return '';
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}
function paraISO(v) {
  const d = paraData(v);
  if (!d) return '';
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function hojeData() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diasAte(v) {
  const d = paraData(v);

  return Math.round((d - hojeData()) / 86400000);
}

    const hay = textoBuscaProc(p);

/* realce das palavras buscadas, sem se perder nos acentos */
function realcar(texto, termo) {
  const s = String(texto || '');
  const tokens = String(termo || '').split(' ').filter((t) => t.length >= 2);
  if (!tokens.length || !s) return s;
  const inteiro = norm(s);
  if (!tokens.some((t) => inteiro.indexOf(t) !== -1)) return s;
  let ns = '';
  const mapa = [];
  for (let i = 0; i < s.length; i++) {
    const n = /\s/.test(s[i]) ? ' ' : norm(s[i]);
    for (let k = 0; k < n.length; k++) { ns += n[k]; mapa.push(i); }
  }
  const faixas = [];
  for (const t of tokens) {
    let i = ns.indexOf(t);
    while (i !== -1) { faixas.push([mapa[i], mapa[i + t.length - 1] + 1]); i = ns.indexOf(t, i + t.length); }
  }
  if (!faixas.length) return s;
  faixas.sort((a, b) => a[0] - b[0]);
  const juntas = [];
  for (const f of faixas) {
    const u = juntas[juntas.length - 1];
    if (u && f[0] <= u[1]) u[1] = Math.max(u[1], f[1]); else juntas.push(f.slice());
  }
  const frag = document.createDocumentFragment();
  let pos = 0;
  for (const f of juntas) {
    if (f[0] > pos) frag.append(s.slice(pos, f[0]));
    frag.append(el('mark', { class: 'c-hit' }, s.slice(f[0], f[1])));
    pos = f[1];
  }
  if (pos < s.length) frag.append(s.slice(pos));
  return frag;
}

let popAtual = null;

function fecharPopover(devolverFoco) {

  popAtual.remove();

  if (devolverFoco && popAnchor && document.contains(popAnchor)) popAnchor.focus();
  popAnchor = null;
}
function abrirPopover(anchor, conteudo, opcoes) {
  fecharPopover();

  const pop = el('div', { class: 'pop' + (opcoes.classe ? ' ' + opcoes.classe : ''), role: opcoes.menu ? 'menu' : 'dialog' }, conteudo);
  document.body.append(pop);

  const w = pop.offsetWidth || 240, h = pop.offsetHeight || 200;
  const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  let left = opcoes.direita ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, vw - w - 8));
  let top = r.bottom + 6;
  if (top + h > vh - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
  pop.addEventListener('click', (e) => e.stopPropagation());
  pop.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fecharPopover(true); return; }
    if (opcoes.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const bs = Array.from(pop.querySelectorAll('button'));
      const i = bs.indexOf(document.activeElement);
      const j = e.key === 'ArrowDown' ? Math.min(bs.length - 1, i + 1) : Math.max(0, i - 1);
      if (bs[j]) { e.preventDefault(); bs[j].focus(); }
    }
  });
  popAtual = pop;
  popAnchor = anchor;
  const primeiro = pop.querySelector('.atual') || pop.querySelector('select, button, input');
  if (primeiro) primeiro.focus();
  return pop;
}
